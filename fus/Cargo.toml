[package]
name = "samloader-fus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Samsung Firmware-Update-Server (FUS) client"
keywords = ["samsung", "firmware"]

[dependencies]
aes = { workspace = true }
ecb = { workspace = true }
fast-md5 = { workspace = true }
roxmltree = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }
tokio = { workspace = true, features = ["rt", "time"] }

[target.'cfg(target_env = "musl")'.dependencies]
reqwest = { workspace = true, features = ["native-tls-vendored"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen-futures = { workspace = true }
