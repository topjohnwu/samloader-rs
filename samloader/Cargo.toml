[package]
name = "samloader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Download and flash firmware for Samsung devices"
keywords = ["samsung", "firmware"]

[dependencies]
samloader-fus = { workspace = true }
samloader-pit = { workspace = true }
samloader-odin = { workspace = true, default-features = false }
binrw = { workspace = true }
clap = { workspace = true, features = ["derive"] }
indicatif = { workspace = true }
cfg-if = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_IO", "Win32_System_Ioctl"] }

[features]
default = ["nusb", "serialport"]
rusb = ["samloader-odin/rusb"]
nusb = ["samloader-odin/nusb"]
serialport = ["samloader-odin/serialport"]
mock = ["samloader-odin/mock"]
