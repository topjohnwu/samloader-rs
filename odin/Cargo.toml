[package]
name = "samloader-odin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Samsung device download mode Odin client"
keywords = ["samsung", "firmware"]

[dependencies]
samloader-pit = { workspace = true }
tar = { workspace = true }
nusb = { workspace = true, optional = true }
binrw = { workspace = true }
fast-md5 = { workspace = true }
thiserror = { workspace = true }
lz4_flex = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = { workspace = true }
# Native nusb runs blocking syscalls (open, claim, clear_halt, ...) on a
# thread pool when awaited; without a runtime feature it panics instead.
nusb = { workspace = true, optional = true, features = ["smol"] }
rusb = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Navigator",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Serial",
    "SerialOptions",
    "SerialPort",
    "SerialPortFilter",
    "SerialPortInfo",
    "SerialPortRequestOptions",
    "Window",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }

[features]
default = ["nusb"]
rusb = ["dep:rusb"]
nusb = ["dep:nusb"]
# Uses the `serialport` crate on native targets and Web Serial on WebAssembly.
serialport = [
    "dep:serialport",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
mock = []
