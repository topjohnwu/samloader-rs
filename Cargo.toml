[workspace]
members = [
    "samloader",
    "fus",
    "pit",
    "odin",
    "web",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/topjohnwu/samloader-rs"
readme = "README.md"

[workspace.dependencies]
samloader-fus = { version = "3.0.0", path = "fus" }
samloader-pit = { version = "3.0.0", path = "pit" }
samloader-odin = { version = "3.0.0", path = "odin" }
reqwest = "0.13"
tokio = "1"
aes = "0.9"
ecb = "0.2"
roxmltree = "0.21"
clap = "4.6"
indicatif = "0.18"
binrw = "0.15"
cfg-if = "1.0"
libc = "0.2"
modular-bitfield = "0.13.1"
rusb = "0.9"
nusb = "0.2.7"
serialport = "4.10"
tar = "0.4"
fast-md5 = "1.0.0"
thiserror = "2"
lz4_flex = "0.14.0"
async-trait = "0.1"
futures-timer = "3.0"
futures = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-cli-support = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
anyhow = "1.0"
rawzip = "0.5"
zlib-rs = "0.6"
libz-rs-sys = "0.6"
