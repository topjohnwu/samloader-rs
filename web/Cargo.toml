[package]
name = "samloader-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
samloader-odin = { workspace = true, default-features = false }
samloader-pit = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "File"] }
futures = { workspace = true }

[features]
default = ["nusb", "serialport"]
nusb = ["samloader-odin/nusb"]
serialport = ["samloader-odin/serialport"]
mock = ["samloader-odin/mock"]
